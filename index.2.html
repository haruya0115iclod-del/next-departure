<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column of station "boards", like the departure sign above a platform */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#17201c; --muted:#5d6a64; --line:#d5dcd8;
  --board:#14231d; --board-ink:#f3f6f4; --board-muted:#9fb3aa;
  --amber:#f2a516; --accent:#0f7a55; --warn:#b4361c;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1210; --surface:#151d1a; --ink:#e6ece9; --muted:#93a39c; --line:#26332e;
  --board:#0a1612; --board-ink:#f3f6f4; --board-muted:#8aa096;
  --amber:#ffb627; --accent:#3fbf8a; --warn:#ff7a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#151d1a; --ink:#e6ece9; --muted:#93a39c; --line:#26332e;
  --board:#0a1612; --board-ink:#f3f6f4; --board-muted:#8aa096;
  --amber:#ffb627; --accent:#3fbf8a; --warn:#ff7a5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.boards{display:flex;flex-direction:column;gap:12px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:.04em}
.clock{font-family:var(--f-num);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.daytype{font-size:13px;color:var(--muted)}
.daytype b{color:var(--ink);font-weight:700}
.chip{display:inline-block;font-size:11px;letter-spacing:.06em;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chip.sample{border-color:var(--amber);color:var(--ink)}
.notice{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.notice.err{border-color:var(--warn)}
.board{background:var(--board);color:var(--board-ink);border-radius:10px;overflow:hidden}
.board-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.st-name{font-size:20px;font-weight:700;letter-spacing:.03em;min-width:0}
.st-line{font-size:12px;color:var(--board-muted)}
.board-tools{display:flex;gap:4px;flex-shrink:0}
.icon-btn{background:none;border:1px solid rgba(255,255,255,.18);color:var(--board-muted);border-radius:6px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}
.icon-btn:hover,.icon-btn:focus-visible{color:var(--board-ink);border-color:var(--board-muted);outline:none}
.dir{padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,.06)}
.dir:first-of-type{border-top:0}
.dir-label{font-size:12px;color:var(--board-muted);letter-spacing:.05em;margin-bottom:4px}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:baseline}
.dep.next .t{font-size:30px;color:var(--amber)}
.dep .t{font-family:var(--f-num);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dep .d{min-width:0;font-size:14px}
.dep .d small{color:var(--board-muted);font-size:11px;margin-right:6px;border:1px solid rgba(255,255,255,.2);border-radius:3px;padding:0 4px}
.dep .d small.fast{border-color:var(--amber);color:var(--amber)}
.dep .in{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--board-muted);text-align:right}
.dep.next .in{font-size:16px;color:var(--board-ink)}
.dep .last{color:var(--warn);font-size:11px;margin-left:4px}
.later{display:flex;flex-direction:column;gap:2px;margin-top:4px;opacity:.85}
.ended{font-size:14px;color:var(--board-muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--muted)}
button.primary{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.ghost{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:15px;margin:0}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.results{display:flex;flex-direction:column;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.results button{all:unset;cursor:pointer;padding:9px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results .sub{color:var(--muted);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:0}
footer{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.dep.next .t{transition:color .3s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">つぎの発車</div>
      <div class="daytype" id="daytype"></div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div id="notice" hidden></div>
  <main id="boards" class="boards"></main>
  <div class="actions">
    <button class="primary" id="btn-add" type="button">＋ 駅を登録</button>
    <button class="ghost" id="btn-settings" type="button">データ設定</button>
  </div>

  <section class="panel" id="add-panel" hidden>
    <h2>駅を登録</h2>
    <label for="q">駅名で検索<input id="q" type="search" placeholder="例：新宿" autocomplete="off"></label>
    <div class="results" id="results"></div>
    <p class="hint" id="add-hint"></p>
  </section>

  <section class="panel" id="settings-panel" hidden>
    <h2>データ設定</h2>
    <label for="src">時刻表データ
      <select id="src">
        <option value="shared">共有データ（自動更新・トークン不要）</option>
        <option value="sample">サンプル（架空の路線）</option>
        <option value="odpt-public">ODPT 公開API：都営（キー不要）</option>
        <option value="odpt-key">ODPT：アクセストークンを使う（チャレンジ用もこちら）</option>
      </select>
    </label>
    <label for="api" id="api-wrap">API
      <select id="api">
        <option value="challenge">データチャレンジ用（api-challenge.odpt.org）</option>
        <option value="standard">通常（api.odpt.org）</option>
      </select>
    </label>
    <label for="op" id="op-wrap">事業者
      <select id="op">
        <option value="TokyoMetro">東京メトロ</option>
        <option value="Toei">都営</option>
        <option value="TWR">りんかい線</option>
        <option value="Yurikamome">ゆりかもめ</option>
        <option value="MIR">つくばエクスプレス</option>
        <option value="JR-East">JR東日本</option>
        <option value="Odakyu">小田急</option>
        <option value="Keio">京王</option>
        <option value="Tokyu">東急</option>
        <option value="Seibu">西武</option>
        <option value="Tobu">東武</option>
        <option value="Keikyu">京急</option>
        <option value="Keisei">京成</option>
        <option value="Sotetsu">相鉄</option>
      </select>
    </label>
    <label for="key" id="key-wrap">アクセストークン（acl:consumerKey）
      <input id="key" type="text" autocomplete="off" spellcheck="false" placeholder="チャレンジ登録時に発行されたトークン">
    </label>
    <div class="actions">
      <button class="primary" id="btn-save" type="button">保存して読み込む</button>
    </div>
    <p class="hint">トークンと登録駅はこの端末のブラウザにだけ保存されます。時刻表は駅ごとに1日1回取得し、次に開いたときは保存済みの時刻表ですぐ表示します。</p>
  </section>

  <footer id="foot"></footer>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("nd:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("nd:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 暦：平日 / 土曜 / 日曜・祝日 ---------- */
const HOLIDAYS = new Set([
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-05-06",
  "2026-07-20","2026-08-11","2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22","2027-04-29","2027-05-03","2027-05-04","2027-05-05",
  "2027-07-19","2027-08-11","2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23"
]);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// 深夜3時までは前日のダイヤとして扱う（終電が0時台にあるため）
function serviceNow(){
  const now = new Date();
  let min = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const day = new Date(now);
  if (now.getHours() < 3){ day.setDate(day.getDate()-1); min += 1440; }
  const dow = day.getDay(), hol = HOLIDAYS.has(ymd(day));
  const kind = hol ? "holiday" : dow === 0 ? "sunday" : dow === 6 ? "saturday" : "weekday";
  return { now, min, day, kind };
}
const KIND_LABEL = { weekday:"平日", saturday:"土曜", sunday:"日曜", holiday:"祝日" };
const CAL_PRIORITY = {
  weekday:["Weekday"], saturday:["Saturday","SaturdayHoliday"],
  sunday:["Sunday","Holiday","SaturdayHoliday"], holiday:["Holiday","Sunday","SaturdayHoliday"]
};
const toMin = hhmm => { const [h,m] = hhmm.split(":").map(Number); return (h < 3 ? h+24 : h)*60 + m; };
const fmt = min => { const h = Math.floor(min/60)%24, m = Math.floor(min%60); return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; };

/* ---------- データ源：サンプル ---------- */
// 架空の2路線。本物の時刻ではありません。
const SAMPLE_LINES = [
  { id:"minato", name:"みなと線", stations:["港中央","市役所前","緑ヶ丘","北浜"], ends:["北浜","港中央"], short:["緑ヶ丘",null], rapid:true },
  { id:"yamate", name:"山手台線", stations:["港中央","桜坂","山手台"], ends:["山手台","港中央"], short:[null,null], rapid:false }
];
function sampleTimes(line, si, dirIdx, cal){
  const n = line.stations.length;
  const pos = dirIdx === 0 ? si : n-1-si;            // その方向で何駅目か
  if (pos === n-1) return [];                         // 終点からは出発しない
  const out = []; let t = 5*60 + 2 + pos*3 + dirIdx*4; let k = 0;
  const holiday = cal !== "Weekday";
  while (t <= 24*60 + 25){
    const h = Math.floor(t/60);
    const peak = !holiday && ((h>=7&&h<9)||(h>=17&&h<19));
    const head = h>=23 ? 15 : h>=21 ? 10 : peak ? 4 : holiday ? 9 : 7;
    const shortTo = line.short[dirIdx];
    let dest = line.ends[dirIdx];
    if (shortTo && k%3===2 && line.stations.indexOf(shortTo) > si) dest = shortTo;
    const type = line.rapid && k%4===1 && h>=7 && h<21 ? "快速" : "各停";
    out.push({ min:t, dest, type });
    t += head; k++;
  }
  if (out.length) out[out.length-1].isLast = true;
  return out;
}
const Sample = {
  label:"サンプル",
  async stations(){
    const list = [];
    SAMPLE_LINES.forEach(l => l.stations.forEach((s,i) => list.push({ id:`sample:${l.id}:${i}`, name:s, railway:l.name })));
    return list;
  },
  async timetables(id){
    const [, lid, si] = id.split(":"); const line = SAMPLE_LINES.find(l => l.id===lid);
    const res = [];
    [0,1].forEach(d => ["Weekday","SaturdayHoliday"].forEach(cal => {
      const times = sampleTimes(line, Number(si), d, cal);
      if (times.length) res.push({ dir:`${line.ends[d]}方面`, cal, times });
    }));
    return res;
  }
};

/* ---------- データ源：ODPT（公共交通オープンデータセンター） ---------- */
const TYPE_JA = { Local:"各停", Rapid:"快速", Express:"急行", LimitedExpress:"特急", SemiExpress:"準急",
  RapidLimitedExpress:"快特", AirportRapidLimitedExpress:"エアポート快特", CommuterExpress:"通勤急行", Commuter:"通勤", "S-TRAIN":"S-TRAIN" };
const FAST = new Set(["快速","急行","特急","快特","エアポート快特","通勤急行","S-TRAIN"]);
function Odpt(withKey, opOverride){
  const cfg = LS.get("cfg", {});
  const base = !withKey ? "https://api-public.odpt.org/api/v4/"
    : cfg.api === "standard" ? "https://api.odpt.org/api/v4/" : "https://api-challenge.odpt.org/api/v4/";
  const op = opOverride || (withKey ? (cfg.op || "TokyoMetro") : "Toei");
  const q = p => base + p + (withKey ? `${p.includes("?")?"&":"?"}acl:consumerKey=${encodeURIComponent(cfg.key||"")}` : "");
  async function get(p){
    const r = await fetch(q(p));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }
  const cacheKey = `odpt:${withKey?(cfg.api||"challenge"):"p"}:${op}:stations`;
  async function stations(){
    const c = LS.get(cacheKey, null);
    if (c && Date.now() - c.at < 7*864e5) return c.list;
    const [st, rw] = await Promise.all([
      get(`odpt:Station?odpt:operator=odpt.Operator:${op}`),
      get(`odpt:Railway?odpt:operator=odpt.Operator:${op}`)
    ]);
    const rname = {}; rw.forEach(r => rname[r["owl:sameAs"]] = (r["odpt:railwayTitle"]||{}).ja || r["dc:title"]);
    const list = st.map(s => ({ id:s["owl:sameAs"], name:(s["odpt:stationTitle"]||{}).ja || s["dc:title"], railway:rname[s["odpt:railway"]] || "" }));
    LS.set(cacheKey, { at:Date.now(), list });
    return list;
  }
  async function timetables(id){
    const names = {}; (await stations()).forEach(s => names[s.id] = s.name);
    const raw = await get(`odpt:StationTimetable?odpt:station=${encodeURIComponent(id)}`);
    return raw.map(tt => {
      const times = (tt["odpt:stationTimetableObject"]||[]).filter(o => o["odpt:departureTime"]).map(o => {
        const dst = (o["odpt:destinationStation"]||[])[0];
        const typ = (o["odpt:trainType"]||"").split(".").pop();
        return { min:toMin(o["odpt:departureTime"]), dest: names[dst] || (dst||"").split(".").pop(), type: TYPE_JA[typ] || typ || "", isLast: !!o["odpt:isLast"] };
      }).sort((a,b) => a.min-b.min);
      const counts = {}; times.forEach(t => counts[t.dest] = (counts[t.dest]||0)+1);
      const main = Object.keys(counts).sort((a,b) => counts[b]-counts[a])[0];
      return { dir: main ? `${main}方面` : (tt["odpt:railDirection"]||"").split(".").pop(), cal:(tt["odpt:calendar"]||"").split(":").pop(), times };
    }).filter(t => t.times.length);
  }
  return { label: withKey ? `ODPT・${op}` : "ODPT・都営", stations, timetables };
}
/* ---------- データ源：共有データ ---------- */
// GitHub Actions が毎日 ODPT から取得して data/ に置いた時刻表を読む。トークンは持ち主の GitHub にだけある
const fileOf = id => id.replace(/[^A-Za-z0-9._-]/g, "_");
async function getJson(path){
  const r = await fetch(path, { cache:"no-cache" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
const Shared = {
  label:"共有データ",
  stations(){ return getJson("data/stations.json"); },
  async timetables(id){
    const raw = await getJson(`data/tt/${fileOf(id)}.json`);
    return raw.map(t => ({ dir:t.dir, cal:t.cal,
      times:t.times.map(([hm, dest, typ, last]) => ({ min:toMin(hm), dest, type:TYPE_JA[typ] || typ || "", isLast:!!last })) }));
  }
};
function source(name, op){ return name === "shared" ? Shared : name === "odpt-public" ? Odpt(false, op) : name === "odpt-key" ? Odpt(true, op) : Sample; }
// 登録済みの駅は、今の設定ではなく駅IDに含まれる事業者で取得する（例 odpt.Station:TokyoMetro.Ginza.Shibuya）
const opOf = id => ((id.split(":")[1] || "").split(".")[0]) || undefined;

/* ---------- 状態 ---------- */
const firstRun = LS.get("cfg", null) === null;
let cfg = LS.get("cfg", { src:"sample", api:"challenge", op:"TokyoMetro", key:"" });
const savedRaw = LS.get("stations", null);
let saved = savedRaw || [];
let sharedInfo = null;   // data/index.json（共有データがあるときだけ）
const ttMem = {};     // id -> {date, list}
let errors = {};

function notice(text, isErr){
  const n = $("notice");
  if (!text){ n.hidden = true; return; }
  n.className = "notice" + (isErr ? " err" : ""); n.textContent = text; n.hidden = false;
}

async function loadTimetable(st, force){
  const key = `${st.src}|${st.id}`;
  const today = ymd(new Date());
  if (!force){
    if (ttMem[key]) return ttMem[key].list;
    const c = LS.get("tt:"+key, null);
    if (c){ ttMem[key] = c; if (c.date !== today) refreshLater(st); return c.list; }
  }
  const list = await source(st.src, st.src === "sample" ? undefined : opOf(st.id)).timetables(st.id);
  const entry = { date:today, list };
  ttMem[key] = entry; LS.set("tt:"+key, entry);
  return list;
}
function refreshLater(st){ setTimeout(() => loadTimetable(st, true).then(render).catch(()=>{}), 50); }

function pickCal(list, kind){
  for (const c of CAL_PRIORITY[kind]){ const hit = list.filter(t => t.cal === c); if (hit.length) return hit; }
  return [];
}

/* ---------- 描画 ---------- */
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function depRow(dep, nowMin, isNext){
  const r = el("div", "dep" + (isNext ? " next" : ""));
  r.append(el("span", "t", fmt(dep.min)));
  const d = el("span", "d");
  if (dep.type){ d.append(el("small", FAST.has(dep.type) ? "fast" : "", dep.type)); }
  d.append(document.createTextNode(dep.dest + "行"));
  if (dep.isLast) d.append(el("span", "last", "終電"));
  r.append(d);
  const left = Math.floor(dep.min - nowMin);
  r.append(el("span", "in", left <= 0 ? "まもなく" : `あと${left}分`));
  return r;
}

let rendering = false;
async function render(){
  if (rendering) return; rendering = true;
  try{
    const sn = serviceNow();
    $("clock").textContent = `${String(sn.now.getHours()).padStart(2,"0")}:${String(sn.now.getMinutes()).padStart(2,"0")}`;
    const dt = $("daytype"); dt.textContent = "";
    dt.append(document.createTextNode("今日は "), el("b", null, `${KIND_LABEL[sn.kind]}ダイヤ`), document.createTextNode(`（${sn.day.getMonth()+1}月${sn.day.getDate()}日）`));
    const box = $("boards"); box.textContent = "";
    if (!saved.length){
      const e = el("div", "empty"); e.append(el("div", null, "登録した駅の次の発車がここに並びます。"), el("div", null, "「＋ 駅を登録」から追加してください。"));
      box.append(e);
    }
    for (const [i, st] of saved.entries()){
      const b = el("section", "board");
      const head = el("div", "board-head");
      const nm = el("div"); nm.append(el("div", "st-name", st.name), el("div", "st-line", `${st.railway}${st.src === "sample" ? "・サンプル" : ""}`));
      const tools = el("div", "board-tools");
      if (i > 0){ const up = el("button", "icon-btn", "↑"); up.type = "button"; up.setAttribute("aria-label", `${st.name}を上へ`); up.onclick = () => { saved.splice(i-1, 0, saved.splice(i,1)[0]); LS.set("stations", saved); render(); }; tools.append(up); }
      const rm = el("button", "icon-btn", "削除"); rm.type = "button"; rm.setAttribute("aria-label", `${st.name}を削除`);
      rm.onclick = () => { saved.splice(i,1); LS.set("stations", saved); render(); };
      tools.append(rm); head.append(nm, tools); b.append(head);
      box.append(b);
      let list;
      try{ list = await loadTimetable(st); delete errors[st.id]; }
      catch(err){
        errors[st.id] = true;
        const d = el("div", "dir"); d.append(el("div", "ended", "時刻表を取得できませんでした。通信状態とデータ設定を確認してください。")); b.append(d);
        continue;
      }
      const todays = pickCal(list, sn.kind);
      if (!todays.length){ const d = el("div", "dir"); d.append(el("div", "ended", "今日のダイヤが見つかりません。")); b.append(d); continue; }
      for (const tt of todays){
        const d = el("div", "dir"); d.append(el("div", "dir-label", tt.dir));
        const up = tt.times.filter(t => t.min >= sn.min - 0.5);
        if (!up.length){ d.append(el("div", "ended", "本日の運行は終了しました")); }
        else{
          d.append(depRow(up[0], sn.min, true));
          if (up.length > 1){ const later = el("div", "later"); up.slice(1,3).forEach(x => later.append(depRow(x, sn.min, false))); d.append(later); }
        }
        b.append(d);
      }
    }
    const src = source(cfg.src);
    const upd = cfg.src === "shared" && sharedInfo ? `（${sharedInfo.updated}更新）` : "";
    $("foot").textContent = `データ：${src.label}${upd}${cfg.src === "sample" ? "（架空の時刻です）" : "　出典：公共交通オープンデータセンター"}`;
  } finally { rendering = false; }
}

/* ---------- 駅の登録 ---------- */
let stationCache = null;
async function openAdd(){
  $("settings-panel").hidden = true;
  const p = $("add-panel"); p.hidden = !p.hidden; if (p.hidden) return;
  $("add-hint").textContent = `検索対象：${source(cfg.src).label}`;
  $("results").textContent = ""; $("q").value = ""; $("q").focus();
  try{ stationCache = await source(cfg.src).stations(); search(); }
  catch(e){ stationCache = []; $("add-hint").textContent = "駅一覧を取得できませんでした。データ設定とネット接続を確認してください。"; }
}
function search(){
  const q = $("q").value.trim(); const r = $("results"); r.textContent = "";
  const hits = (stationCache||[]).filter(s => !q || s.name.includes(q)).slice(0, 40);
  if (!hits.length){ r.append(el("div", "hint", "　該当する駅がありません")); return; }
  hits.forEach(s => {
    const btn = el("button"); btn.type = "button";
    btn.append(el("span", null, s.name), el("span", "sub", s.railway));
    btn.onclick = () => {
      if (!saved.some(x => x.id === s.id && x.src === cfg.src)){ saved.push({ ...s, src:cfg.src }); LS.set("stations", saved); }
      $("add-panel").hidden = true; render();
    };
    r.append(btn);
  });
}

/* ---------- データ設定 ---------- */
function syncSettings(){
  $("src").value = cfg.src; $("api").value = cfg.api || "challenge"; $("op").value = cfg.op || "TokyoMetro"; $("key").value = cfg.key || "";
  showKeyFields();
}
function showKeyFields(){ const k = $("src").value === "odpt-key"; ["api-wrap","op-wrap","key-wrap"].forEach(id => $(id).hidden = !k); }
$("btn-settings").onclick = () => { $("add-panel").hidden = true; const p = $("settings-panel"); p.hidden = !p.hidden; syncSettings(); };
$("src").onchange = showKeyFields;
$("btn-save").onclick = async () => {
  cfg = { src:$("src").value, api:$("api").value, op:$("op").value, key:$("key").value.trim() };
  LS.set("cfg", cfg);
  if (cfg.src === "sample"){ notice(""); $("settings-panel").hidden = true; return; }
  notice("駅一覧を読み込んでいます…");
  try{
    const list = await source(cfg.src).stations();
    notice(`${list.length}駅を読み込みました。「＋ 駅を登録」から駅を選んでください。`);
    $("settings-panel").hidden = true;
  }catch(e){
    notice(`時刻表サーバーにつながりませんでした（${e.message}）。この画面の中からは外部APIに接続できない場合があります。自分のサーバーに置いた版で試してください。`, true);
  }
};
$("btn-add").onclick = openAdd;
$("q").oninput = search;

(async () => {
  try{ sharedInfo = await getJson("data/index.json"); }catch(e){}
  // 初めて開いた人は、共有データがあればそれを使い、なければサンプル駅を2つ登録した状態で開く
  if (firstRun && sharedInfo){ cfg.src = "shared"; LS.set("cfg", cfg); }
  if (!savedRaw){
    saved = sharedInfo ? (sharedInfo.defaultStations || []).map(s => ({ ...s, src:"shared" })) : [
      { id:"sample:minato:0", name:"港中央", railway:"みなと線", src:"sample" },
      { id:"sample:yamate:1", name:"桜坂", railway:"山手台線", src:"sample" }
    ];
    LS.set("stations", saved);
  }
  render();
  setInterval(render, 15000);
})();
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
})();
</script>
